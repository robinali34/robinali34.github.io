---
layout: default
title: Home
---

<div class="blog-categories">
  {% for category in site.blog_categories %}
  <div class="blog-category">
    <h2 class="category-title">{{ category.name }}</h2>
    <div class="blog-grid">
      {% for blog in category.blogs %}
      <a href="{{ blog.url }}" target="_blank" class="blog-link" data-color="{{ blog.color }}">
        <div class="blog-link-title">{{ blog.name }}</div>
        <div class="blog-link-description">{{ blog.description }}</div>
      </a>
      {% endfor %}
    </div>
  </div>
  {% endfor %}
  
  <div class="blog-category">
    <h2 class="category-title">Other</h2>
    <div class="blog-grid">
      <a href="https://github.com/{{ site.github_username }}" target="_blank" class="blog-link" data-color="#333">
        <div class="blog-link-title">GitHub Profile</div>
        <div class="blog-link-description">Check out my repositories</div>
      </a>
    </div>
  </div>
</div>

<script>
document.querySelectorAll('.blog-link[data-color]').forEach(function (link) {
  link.style.setProperty('--blog-color', link.getAttribute('data-color'));
});
</script>
